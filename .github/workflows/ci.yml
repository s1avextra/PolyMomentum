name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_engine/Cargo.lock', 'rust_engine/Cargo.toml') }}

      - name: Format
        working-directory: rust_engine
        run: cargo fmt --check

      - name: Clippy
        working-directory: rust_engine
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: rust_engine
        run: cargo test --locked

      - name: Release build
        working-directory: rust_engine
        run: cargo build --release --locked --bin polymomentum-engine
