[project]
name = "polymomentum-research"
version = "0.1.0"
description = "PolyMomentum Python research loop: analysis scripts, validators, and the scheduled strategy-research runner"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
